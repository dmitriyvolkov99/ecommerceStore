<h1 class="mb-6 text-3xl font-extrabold tracking-tight md:text-4xl">Мои заказы</h1>

<div class="overflow-hidden rounded-3xl border border-line bg-white">
  <div class="hidden grid-cols-[110px_1fr_160px_140px_24px] gap-4 border-b border-line bg-ground px-6 py-3 text-xs font-bold uppercase tracking-wide text-mute md:grid">
    <span>Заказ</span><span>Дата</span><span>Статус</span><span class="text-right">Сумма</span><span></span>
  </div>

  @for (order of orders(); track order.id) {
    <a [routerLink]="['/orders', order.id]"
       class="grid grid-cols-2 items-center gap-x-4 gap-y-1 border-b border-line px-4 py-4 last:border-b-0 hover:bg-ground md:grid-cols-[110px_1fr_160px_140px_24px] md:px-6 md:py-5">
      <b class="text-base"># {{ order.id }}</b>
      <b class="text-right md:order-4">{{ order.total | currency: 'USD' }}</b>
      <span class="text-sm text-mute md:order-2 md:text-base">{{ order.orderDate | date: 'd MMMM y, HH:mm' }}</span>
      <span class="justify-self-end rounded-full bg-ground px-3 py-1 text-xs font-bold md:order-3 md:justify-self-start md:text-sm">
        {{ order.status }}
      </span>
      <span class="hidden text-mute md:order-5 md:block">›</span>
    </a>
  } @empty {
    <div class="p-10 text-center text-mute">
      У вас пока нет заказов.
      <a routerLink="/shop" class="font-bold text-ink underline">Перейти в каталог</a>
    </div>
  }
</div>
