<div class="container mt-5">
  <div class="row">
    <div class="col-12">
      <table class="table table-hover" style="cursor: pointer;">
        <thead class="thead-light">
          <tr>
            <th>Заказ</th>
            <th>Дата</th>
            <th>Сумма</th>
            <th>Статус</th>
          </tr>
        </thead>
        <tbody>
          @for (order of orders(); track order.id) {
            <tr [routerLink]="['/orders', order.id]">
              <th># {{ order.id }}</th>
              <th>{{ order.orderDate | date: 'medium' }}</th>
              <th>{{ order.total | currency }}</th>
              <th>{{ order.status }}</th>
            </tr>
          } @empty {
            <tr>
              <td colspan="4">У вас пока нет заказов</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
