<header>
  @if (totalCount() > 0) {
    <span>
      Показано <strong>{{ from() }} - {{ to() }}</strong>
      из <strong>{{ totalCount() }}</strong> результатов
    </span>
  } @else {
    <span>Нет результатов для этого фильтра</span>
  }
</header>
