<div class="rounded-3xl border border-line bg-white p-6">
  <h2 class="text-lg font-extrabold tracking-tight">Сумма заказа</h2>

  @if (totals(); as t) {
    <dl class="mt-4 flex flex-col gap-3">
      <div class="flex justify-between text-mute">
        <dt>Товары</dt>
        <dd class="font-semibold text-ink">{{ t.subtotal | currency: 'USD' }}</dd>
      </div>
      <div class="flex justify-between text-mute">
        <dt>Доставка</dt>
        <dd class="font-semibold text-ink">
          {{ t.shipping > 0 ? (t.shipping | currency: 'USD') : '—' }}
        </dd>
      </div>
      <div class="h-px bg-line"></div>
      <div class="flex justify-between text-xl font-extrabold">
        <dt>Итого</dt>
        <dd>{{ t.total | currency: 'USD' }}</dd>
      </div>
    </dl>
  }

  <p class="mt-4 text-sm text-mute">Стоимость доставки добавится при оформлении заказа.</p>
</div>
