<div>
  <ul class="mb-6 flex gap-2 overflow-x-auto">
    @for (step of steps; track step; let i = $index) {
      <li class="flex-1">
        <button type="button" (click)="onClick(i)" [disabled]="true"
                [class]="selectedIndex === i ? 'bg-ink text-white' : 'bg-white text-mute'"
                class="w-full whitespace-nowrap rounded-full border border-line px-4 py-3 text-sm font-bold uppercase tracking-wide">
          {{ step.label }}
        </button>
      </li>
    }
  </ul>

  <div>
    <ng-container [ngTemplateOutlet]="selected?.content" />
  </div>
</div>
