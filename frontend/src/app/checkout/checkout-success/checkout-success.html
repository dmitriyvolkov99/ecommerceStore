<div class="container mt-5">
  <div><i class="fa fa-check-circle fa-5x" style="color: green;"></i></div>
  <h2>Спасибо! Ваш заказ подтверждён</h2>
  <p class="mb-4">
    Заказ пока не отправлен — это нормально, ведь мы настоящий магазин
  </p>

  @if (order; as order) {
    <button [routerLink]="['/orders', order.id]" class="btn btn-outline-success">Посмотреть заказ</button>
  } @else {
    <button routerLink="/orders" class="btn btn-outline-success">Посмотреть мои заказы</button>
  }
</div>
