<section class="rounded-3xl border border-line bg-white p-5 md:p-7" [formGroup]="checkoutForm()">
  <h2 class="mb-5 text-xl font-extrabold tracking-tight">Способ доставки</h2>

  <div class="flex flex-col gap-3" formGroupName="deliveryForm">
    @for (method of deliveryMethods(); track method.id) {
      <label [for]="method.id"
             class="flex cursor-pointer items-center gap-4 rounded-2xl border border-line p-4 transition hover:bg-ground has-checked:border-ink has-checked:ring-1 has-checked:ring-ink">
        <input type="radio" (click)="setShippingPrice(method)" id="{{ method.id }}" value="{{ method.id }}"
               formControlName="deliveryMethod" class="size-5 shrink-0 accent-ink" />
        <span class="flex-1">
          <span class="block font-bold">{{ method.shortName }}</span>
          <span class="block text-sm text-mute">{{ method.description }}</span>
        </span>
        <strong class="whitespace-nowrap">{{ method.price | currency: 'USD' }}</strong>
      </label>
    }
  </div>
</section>
